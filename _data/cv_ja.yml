        location: 中国・北京
        start_date: 2023-09
        end_date: 2024-02
        summary: >-
          Carnegie Mellon University の Soummya Kar 教授と Southeast University
          の Qiang Gao 准教授の共同指導の下、PM2.5 曝露と呼吸器疾患発症率の関係を研究。
        highlights:
          - Python を用いて探索的分析、統計的推論、可視化を実施。
          - 独立研究プロジェクトであり、Carnegie Mellon University での職歴ではありません。
          - 発表論文の分析にはランダム生成された合成データを使用し、実世界の臨床・環境データではありません。

